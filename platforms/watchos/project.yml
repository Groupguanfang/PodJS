name: PodJSWatchApp
options:
  bundleIdPrefix: com.wilflin.podjs
  deploymentTarget:
    watchOS: "11.0"
packages:
  PodJSWatch:
    path: .
targets:
  PodJSWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: App
      - path: ../../dist/watchos-watch
        buildPhase: resources
    dependencies:
      - package: PodJSWatch
        product: PodJSWatch
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 14
        DEVELOPMENT_TEAM: 9887KU7FN7
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PodJS
        INFOPLIST_KEY_WKWatchOnly: YES
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.wilflin.podjs.watchgallery
        SWIFT_VERSION: 6.0
    scheme:
      gatherCoverageData: false
      testTargets:
        - PodJSWatchTests
        - PodJSWatchUITests

  PodJSWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Tests/PodJSWatchTests
    dependencies:
      - package: PodJSWatch
        product: PodJSWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wilflin.podjs.watchgallery.tests
        SWIFT_VERSION: 6.0

  PodJSWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Tests/PodJSWatchUITests
    dependencies:
      - target: PodJSWatchApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wilflin.podjs.watchgallery.uitests
        SWIFT_VERSION: 6.0
